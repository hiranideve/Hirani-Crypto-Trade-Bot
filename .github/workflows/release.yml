name: Build & Release

# تاگێک بنێرە (بۆ نموونە v2.0.0) و GitHub خۆی بویڵد دەکات و
# پەڕگەکان بە ڕیلیزەکەوە هەڵدەواسێت.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --publish never: تاگ کە هەبێت، electron-builder خۆی هەوڵ دەدات
      # فایلەکان ئەپلۆد بکات و داوای GH_TOKEN دەکات. ئەپلۆدکردن کاری
      # هەنگاوی «Publish release»ـە لە خوارەوە، بۆیە لێرە دەکوژێنرێتەوە.
      - name: Build Windows installer + portable
        run: npm run build -- --publish never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          draft: false
          generate_release_notes: true
