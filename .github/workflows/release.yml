name: Build & Release

# تاگێک بنێرە (بۆ نموونە v2.0.0) و GitHub خۆی بویڵد دەکات و
# پەڕگەکان بە ڕیلیزەکەوە هەڵدەواسێت.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer + portable
        run: npm run build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          draft: false
          generate_release_notes: true
